name: Reporte diario

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 6:00 a. m. hora Colombia, lunes a viernes
  workflow_dispatch:
    inputs:
      modo:
        description: "diario | intradia | ticker | dividendos"
        default: "diario"
      ticker:
        description: "Solo para modo ticker (ej. AAPL o ECOPETROL.CL)"
        default: ""

permissions:
  contents: write

concurrency:
  group: bolsa
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ejecutar
        env:
          MODO: ${{ github.event.inputs.modo || 'diario' }}
          TICKER: ${{ github.event.inputs.ticker }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
          EMAIL_CLAVE_APP: ${{ secrets.EMAIL_CLAVE_APP }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          COMISION_US: ${{ vars.COMISION_US }}
          COMISION_CO: ${{ vars.COMISION_CO }}
        run: python main.py "$MODO" "$TICKER"
      - name: Guardar señales del día
        run: |
          git config user.name "bolsa-bot"
          git config user.email "bolsa-bot@users.noreply.github.com"
          git add datos/
          git diff --cached --quiet || (git commit -m "Actualiza señales" && git pull --rebase && git push)
